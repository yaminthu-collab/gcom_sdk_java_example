spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/merchant}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
merchant.api-key=${THARABA_GATE_API_KEY:local-demo-placeholder}
merchant.webhook-secret=${THARABA_GATE_WEBHOOK_SECRET:}
merchant.environment=${THARABA_GATE_ENVIRONMENT:TEST}
merchant.base-url=${THARABA_GATE_BASE_URL:http://localhost:9090}
merchant.qr-zone=${THARABA_GATE_QR_ZONE:Asia/Rangoon}
merchant.public-url=${MERCHANT_PUBLIC_URL:http://localhost:8080}
merchant.recovery-delay-ms=60000
merchant.recovery-backoff-seconds=300
